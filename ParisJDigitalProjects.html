<body>
<h1>My Digital Projects, by Paris J</h1>

	<iframe
	  src="https://new.express.adobe.com/embedLink/urn:aaid:sc:VA6C2:3d4024d5-dceb-519b-9b34-ba2394c8dac0?promoid=Y69SGM5H&sdid=C4SZ2FYJ&mv=other"
	  width="1280"

<button class="likeButtons">Like</button>

<div class="embed-box">
	<h2>My 2nd Project: Video About My Day</h2>
	
	<iframe
	  src="https://new.express.adobe.com/embedLink/urn:aaid:sc:VA6C2:13ce3695-32b4-527f-9d74-5d2d69e28a34?promoid=Y69SGM5H&sdid=C4SZ2FYJ&mv=other"
	  width="1280"
	  height="720"
	  loading="lazy"
	  allowfullscreen="allowfullscreen"
	  allow="clipboard-write; fullscreen"
	  referrerpolicy="strict-origin-when-cross-origin"
	  frameborder="0"
	  style="width:80%; max-width:1280px; height:auto; aspect-ratio:1280/720; border:0; display:block; margin:0 auto;"
	  
	></iframe>

<button class="likeButtons">Like</button>
<span class="numLikes">0</span>

</div>



<script type="module">
    // Import the functions you need from the SDKs you need
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
	import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";
    // TODO: Add SDKs for Firebase products that you want to use
    // https://firebase.google.com/docs/web/setup#available-libraries

    // Your web app's Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyCttIzwHeC-UP--YgVZLAeyWMIPQauz-D0",
      authDomain: "likebuttons1-9c9b1.firebaseapp.com",
      projectId: "likebuttons1-9c9b1",
      storageBucket: "likebuttons1-9c9b1.firebasestorage.app",
      messagingSenderId: "608277374970",
      appId: "1:608277374970:web:beafd9676a66e05fcba643"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
	const db = getDatabase(app);
	const likeButtons = document.querySelectorAll(".likeButtons")
	const numLikes = document.querySelectorAll(".numLikes")

	for (let i=0; i<likeButtons.length; i++) {
		likeButtons[i].addEventListener('click', function(){ Like(i) })
		onValue(ref(db, "/project "+i+"/numLikes"), (snapshot) => {
			let data = snapshot.val();
			numLikes[i].innerHTML = data
		});
	}

	function Like(i) {
		let numberLikes = parseInt(numLikes[i].innerHTML)
		numberLikes = numberLikes + 1
		set(ref(db, "project " + i), {
			numLikes: numberLikes,
		});
	}
	
	

		


	
</script>

	
</body>
